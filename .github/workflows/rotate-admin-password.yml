name: Rotate Render ADMIN_PASSWORD

on:
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'New ADMIN_PASSWORD value to set on the Render service'
        required: true

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Rotate ADMIN_PASSWORD on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          NEW_PASSWORD: ${{ github.event.inputs.admin_password }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ] || [ -z "$NEW_PASSWORD" ]; then
            echo "Missing RENDER_API_KEY, RENDER_SERVICE_ID or admin_password input. Exiting."
            exit 1
          fi
          # Upsert the ADMIN_PASSWORD env var on the Render service
          curl -sf -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"envVars\": [{\"key\": \"ADMIN_PASSWORD\", \"value\": \"${NEW_PASSWORD}\"}]}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" \
            -o /tmp/render-resp.json || true
          cat /tmp/render-resp.json
          echo "ADMIN_PASSWORD updated. Triggering redeploy..."
          curl -sf -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" || true
