name: Diagnose Render Build Failure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Raw API probes
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          owner_id=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" | jq -r '.ownerId // empty')
          echo "ownerId=$owner_id"

          echo "=== Last deploys ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=5" | \
            jq -r '.[] | [.deploy.id, .deploy.status, .deploy.createdAt, (.deploy.commit.message // "" | .[0:60])] | @tsv'

          echo "=== Env var status (values redacted) ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" | \
            jq -r '.[] | .envVar as $v |
              (if $v.value == null or $v.value == "" then "EMPTY"
               elif (["pksingh-jwt-secret-change-this-to-a-strong-random-value","change-me","changeme","changeme_replace_in_production","adminpassword123"] | index($v.value)) then "PLACEHOLDER"
               elif $v.value == "admin@example.com" then "PLACEHOLDER"
               else "SET" end) as $flag |
              "\($v.key)=$flag (sync=\($v.sync // false))"'

          echo "=== Build logs for service (owner-based) ==="
          # Render's /v1/logs expects RFC3339 timestamps, not Unix seconds
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-2H +%Y-%m-%dT%H:%M:%SZ)
          resp=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/logs?ownerId=${owner_id}&resource=${RENDER_SERVICE_ID}&startTime=${start}&endTime=${end}&limit=300")
          echo "--- raw response head ---"
          echo "${resp:0:300}"
          echo "--- parsed ---"
          echo "$resp" | jq -r 'if type == "array" then .[] else (.logs // [])[] end | "\(.timestamp // "") [\(.type // "")] \(.message // "")"' | tail -200
