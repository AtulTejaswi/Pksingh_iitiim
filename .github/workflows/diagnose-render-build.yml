name: Diagnose Render Build Failure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Raw API probes
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          owner_id=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" | jq -r '.ownerId // empty')
          echo "ownerId=$owner_id"

          echo "=== Last deploys ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=5" | \
            jq -r '.[] | [.deploy.id, .deploy.status, .deploy.createdAt, (.deploy.commit.message // "" | .[0:60])] | @tsv'

          echo "=== Env var status (values redacted) ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" > /tmp/envs.json
          node -e '
            const fs = require("fs");
            const arr = JSON.parse(fs.readFileSync("/tmp/envs.json", "utf8"));
            const ph = ["pksingh-jwt-secret-change-this-to-a-strong-random-value", "change-me", "changeme", "changeme_replace_in_production", "adminpassword123", "admin@example.com"];
            for (const e of arr) {
              const v = e.envVar || {};
              const flag = v.value == null || v.value === "" ? "EMPTY" : ph.includes(v.value) ? "PLACEHOLDER" : "SET";
              console.log(`${v.key}=${flag} (sync=${v.sync ?? false})`);
            }
          '

          echo "=== Try both env-var PATCH shapes ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" > /tmp/envs-before.json
          node -e '
            const fs = require("fs");
            const arr = JSON.parse(fs.readFileSync("/tmp/envs-before.json", "utf8"));
            const v = arr.find(e => (e.envVar || {}).key === "LOCAL_JWT_SECRET");
            console.log("before: value length =", (v && v.envVar.value || "").length, "placeholder?", v && /change-this-to-a-strong|change-me|changeme/.test(v.envVar.value));
          '
          testval=$(date +%s)
          echo "--- Attempt A: serviceDetails.envVars ---"
          curl -s -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"serviceDetails\":{\"envVars\":[{\"key\":\"LOCAL_JWT_SECRET\",\"value\":\"${testval}\",\"sync\":false}]}}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" | head -c 2000
          echo
          echo "--- Attempt B: top-level envVars ---"
          curl -s -X PATCH -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"envVars\":[{\"key\":\"LOCAL_JWT_SECRET\",\"value\":\"${testval}\",\"sync\":false}]}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" | head -c 2000
          echo
          sleep 5
          echo "--- after both attempts ---"
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" > /tmp/envs-after.json
          node -e '
            const fs = require("fs");
            const arr = JSON.parse(fs.readFileSync("/tmp/envs-after.json", "utf8"));
            for (const e of arr) {
              const v = e.envVar || {};
              const len = (v.value || "").length;
              console.log(`${v.key}=len:${len} placeholder:${/change-this-to-a-strong|change-me|changeme/.test(v.value || "")} (sync=${v.sync ?? false})`);
            }
          '

          echo "=== Build logs for service (owner-based) ==="
          # Render's /v1/logs expects RFC3339 timestamps, not Unix seconds
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-2H +%Y-%m-%dT%H:%M:%SZ)
          resp=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/logs?ownerId=${owner_id}&resource=${RENDER_SERVICE_ID}&startTime=${start}&endTime=${end}&limit=300")
          echo "--- raw response head ---"
          echo "${resp:0:300}"
          echo "--- parsed ---"
          echo "$resp" | jq -r 'if type == "array" then .[] else (.logs // [])[] end | "\(.timestamp // "") [\(.type // "")] \(.message // "")"' | tail -200
