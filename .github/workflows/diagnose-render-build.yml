name: Diagnose Render Build Failure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch service and deployment info
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "=== Service info ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" | jq '{
              name: .service.name // .name,
              id: .service.id // .id,
              type: .service.type // .type,
              state: .service.state // .service.state,
              ownerId: .service.ownerId // .ownerId,
            }'

          echo "=== Last failed deploy list ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=8" | \
            jq -r '.[] | "\(.deploy.id // .id) | \(.deploy.status // .status) | \(.deploy.startedAt // "") | \(.deploy.commit.message // "")"'

      - name: Fetch build logs for latest deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          latest=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=3")
          while IFS= read -r line; do
            dep_id=$(echo "$line")
            echo "==================== DEPLOY $dep_id BUILD LOGS ===================="
            curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/logs?resourceId=${dep_id}&type=build&limit=200" | \
              jq -r '.logs[]? | "\(.timestamp // "") [\(.type // "")] \(.message // "")"' | tail -120
          done < <(echo "$latest" | jq -r '.[].deploy.id // .[].id')
