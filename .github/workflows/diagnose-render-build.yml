name: Diagnose Render Build Failure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Raw API probes
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "=== GET deploys list (raw, first 400 chars) ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=3" | head -c 600

          echo ""
          echo "=== POST fresh deploy (raw) ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" | head -c 600

          echo ""
          echo "=== GET /logs raw for service ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/logs?resourceId=${RENDER_SERVICE_ID}&limit=20" | head -c 800